<!doctype html>
<!-- Imagen para la vista previa al compartir (1200×630). Se genera con:
     msedge --headless --window-size=1200,630 --screenshot=sitio/img/compartir.png herramientas/imagen-compartir.html -->
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&family=Poppins:wght@300;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#0f2547;color:#f2f5fa;font-family:Inter,sans-serif;position:relative}
  .anillos{position:absolute;right:-90px;top:50%;width:560px;height:560px;margin-top:-280px;border-radius:50%;
           border:1px solid #1f6fe066;box-shadow:0 0 0 70px #1f6fe00d,0 0 0 150px #1f6fe008}
  .insignia{position:absolute;right:100px;top:50%;width:300px;height:300px;margin-top:-150px;border-radius:50%;
            background:#fff;display:grid;place-items:center;box-shadow:0 20px 60px #0008}
  .insignia svg{width:46%;height:auto;overflow:visible}
  .texto{position:absolute;left:84px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
  .marca{display:flex;align-items:center;gap:14px;margin-bottom:44px}
  .marca svg{height:62px;width:auto}
  .marca .wm{font-family:Poppins,sans-serif;line-height:1.05;font-size:30px}
  .marca .wm b{display:block;font-weight:700;letter-spacing:.02em}
  .marca .wm span{display:block;font-weight:300;letter-spacing:.05em;color:#6ea8ff}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:58px;line-height:1.08;margin:0 0 26px}
  p{font-size:26px;line-height:1.4;color:#a9b6cc;margin:0}
  .web{position:absolute;left:84px;bottom:44px;font-size:22px;color:#6ea8ff;letter-spacing:.02em}
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <mask id="h"><rect width="60" height="72" fill="#fff"/><circle cx="37" cy="40" r="9" fill="#000"/></mask>
      <clipPath id="b"><rect x="0" y="44" width="60" height="28"/></clipPath>
    </defs>
    <symbol id="p" viewBox="0 0 60 72">
      <circle cx="8" cy="8" r="7" fill="#1f6fe0"/>
      <g mask="url(#h)">
        <circle cx="36" cy="40" r="22" fill="currentColor"/>
        <circle cx="36" cy="40" r="22" fill="#1f6fe0" clip-path="url(#b)"/>
        <rect x="6" y="18" width="16" height="54" rx="2" fill="currentColor"/>
      </g>
    </symbol>
  </svg>

  <div class="anillos"></div>
  <div class="insignia"><svg viewBox="0 0 60 72" style="color:#0f2547"><use href="#p"/></svg></div>

  <div class="texto">
    <div class="marca">
      <svg viewBox="0 0 60 72" style="color:#ffffff"><use href="#p"/></svg>
      <div class="wm"><b>INVERSIONES</b><span>PELLEGRINI</span></div>
    </div>
    <h1>Invertimos en el mercado nacional e internacional</h1>
    <p>Asesoría en inversiones con visión de mediano y largo plazo.</p>
  </div>
  <div class="web">www.inversionespellegrini.cl</div>
</body>
</html>
