<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.classList.add("js")</script>
<title>{{pagina.titulo}}</title>
<meta name="description" content="{{pagina.descripcion}}">
<link rel="canonical" href="{{pagina.url}}">
<meta name="theme-color" content="#0f2547">
<!-- Vista previa al compartir (WhatsApp, Facebook, LinkedIn, X) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Inversiones Pellegrini">
<meta property="og:locale" content="es_CL">
<meta property="og:title" content="{{pagina.titulo}}">
<meta property="og:description" content="{{pagina.descripcion}}">
<meta property="og:url" content="{{pagina.url}}">
<meta property="og:image" content="{{pagina.imagen}}">
<meta property="og:image:secure_url" content="{{pagina.imagen}}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Inversiones Pellegrini: invertimos en el mercado nacional e internacional">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{pagina.titulo}}">
<meta name="twitter:description" content="{{pagina.descripcion}}">
<meta name="twitter:image" content="{{pagina.imagen}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Poppins:wght@300;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fb; --surface:#ffffff; --ink:#0f2547; --muted:#56637a;
    --navy:#0f2547; --navy-ink:#f2f5fa; --navy-muted:#a9b6cc; --navy-accent:#6ea8ff;
    --accent:#1f6fe0; --accent-ink:#ffffff; --line:#dfe5ef;
    --logo-dark:#0f2547; --logo-blue:#1f6fe0;
    --radius:14px; --max:1120px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1324; --surface:#131e35; --ink:#edf1f7; --muted:#a1adc2;
      --navy:#07101f; --navy-ink:#edf1f7; --navy-muted:#97a3b8; --navy-accent:#6ea8ff;
      --accent:#4b8df0; --accent-ink:#06101f; --line:#24304a;
      --logo-dark:#edf1f7; --logo-blue:#4b8df0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1324; --surface:#131e35; --ink:#edf1f7; --muted:#a1adc2;
    --navy:#07101f; --navy-ink:#edf1f7; --navy-muted:#97a3b8; --navy-accent:#6ea8ff;
    --accent:#4b8df0; --accent-ink:#06101f; --line:#24304a;
    --logo-dark:#edf1f7; --logo-blue:#4b8df0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Sin contorno al tocar o hacer clic; se mantiene al navegar con teclado */
  a:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
  html{scroll-behavior:smooth;scroll-padding-top:72px}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .5em;font-weight:600}
  h2{font-size:clamp(1.7rem,3.2vw,2.4rem)}
  a{color:inherit}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 16px}
  .btn{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;
       padding:.8em 1.4em;border-radius:999px;font-weight:600;border:0;cursor:pointer;font-size:1rem;text-align:center}
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor;opacity:.9}
  .eyebrow{color:var(--accent);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem;margin-bottom:.6em}
  .todo{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:4px;padding:0 .3em;font-style:normal}

  /* Header */
  header{position:sticky;top:0;z-index:10;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
  .logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--logo-dark);line-height:1}
  .logo svg{height:40px;width:auto;flex:none}
  .logo .wm{font-family:Poppins,Inter,sans-serif;display:flex;flex-direction:column;gap:1px}
  .logo .wm b{font-weight:700;font-size:1.02rem;letter-spacing:.02em}
  .logo .wm span{font-weight:300;font-size:1.02rem;letter-spacing:.05em;color:var(--logo-blue)}
  /* Logo original (azul marino y azul) sobre una placa blanca para que se vea en el pie oscuro */
  footer .logo{--logo-dark:#0f2547;--logo-blue:#1f6fe0;display:inline-flex;background:#fff;padding:10px 16px;border-radius:12px;margin-bottom:14px}
  header{transition:box-shadow .3s ease}
  header.scrolled{box-shadow:0 6px 24px #0f25471a}
  nav{display:flex;gap:22px;font-size:.95rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  nav a{position:relative;text-decoration:none;color:var(--logo-dark);white-space:nowrap;transition:color .2s ease}
  nav a:hover{color:var(--accent)}
  /* Subrayado animado al pasar el mouse (escritorio) */
  nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:2px;background:var(--accent);
               transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
  nav a:hover::after,nav a[aria-current="page"]::after{transform:scaleX(1)}
  nav a[aria-current="page"]{color:var(--accent)}

  /* Botón hamburguesa que se transforma en X */
  .menu-btn{display:none;position:relative;width:44px;height:44px;background:none;border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--logo-dark)}
  .menu-btn span{position:absolute;left:11px;width:20px;height:2px;border-radius:2px;background:currentColor;
                 transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s ease,top .3s cubic-bezier(.2,.8,.2,1)}
  .menu-btn span:nth-child(1){top:15px} .menu-btn span:nth-child(2){top:21px} .menu-btn span:nth-child(3){top:27px}
  .menu-btn[aria-expanded="true"] span:nth-child(1){top:21px;transform:rotate(45deg)}
  .menu-btn[aria-expanded="true"] span:nth-child(2){opacity:0;transform:scaleX(.3)}
  .menu-btn[aria-expanded="true"] span:nth-child(3){top:21px;transform:rotate(-45deg)}
  .backdrop{display:none}

  @media (max-width:1180px){
    .menu-btn{display:block}
    nav{position:absolute;top:72px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--line);
        box-shadow:0 18px 30px #0f25471f;flex-direction:column;padding:6px 16px 16px;gap:0;
        opacity:0;visibility:hidden;transform:translateY(-12px);pointer-events:none;
        transition:opacity .25s ease,transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s}
    nav.open{opacity:1;visibility:visible;transform:none;pointer-events:auto;
             transition:opacity .25s ease,transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
    nav a{padding:14px 4px;border-top:1px solid var(--line);opacity:0;transform:translateY(-6px);
          transition:opacity .25s ease,transform .3s ease,color .2s ease}
    nav a:first-child{border-top:0}
    nav a::after{display:none}
    nav.open a{opacity:1;transform:none}
    nav.open a:nth-child(2){transition-delay:.04s} nav.open a:nth-child(3){transition-delay:.08s}
    nav.open a:nth-child(4){transition-delay:.12s} nav.open a:nth-child(5){transition-delay:.16s}
    nav.open a:nth-child(6){transition-delay:.2s}
    .backdrop{display:block;position:fixed;inset:72px 0 0 0;z-index:9;background:#0f254740;opacity:0;visibility:hidden;
              transition:opacity .3s ease,visibility 0s linear .3s}
    .backdrop.show{opacity:1;visibility:visible;transition:opacity .3s ease,visibility 0s}
  }

  /* ---- Animaciones ---- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:translate(-50px,10px) scale(.85)}to{opacity:1;transform:translate(-50px,10px) scale(1)}}
  @keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #25d36680}100%{box-shadow:0 0 0 18px #25d36600}}
  .btn{transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #1f6fe040}
  .card{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #0f25471a;border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
  .card .link{transition:letter-spacing .2s ease}
  .card .link:hover{letter-spacing:.02em}
  /* Aparición al hacer scroll: solo si JavaScript está activo */
  .js .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
  .js .reveal.in{opacity:1;transform:none}
  /* Entrada de la bienvenida */
  .hero h1{animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) .1s both}
  .hero p{animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) .25s both}
  .hero .ctas{animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) .4s both}
  .hero-mark .badge{animation:popIn .9s cubic-bezier(.2,.8,.2,1) .3s both,float 6s ease-in-out 1.4s infinite}
  .wa{animation:pulse 2.4s ease-out 2s infinite}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .js .reveal{opacity:1;transform:none}
  }

  /* Hero */
  .hero{background:var(--navy);color:var(--navy-ink);padding:96px 0 104px;text-align:center;position:relative;overflow:hidden}
  .hero .wrap{position:relative;z-index:1}
  .hero-mark{position:absolute;right:-120px;top:-60px;width:520px;height:520px;border-radius:50%;display:grid;place-items:center;
             border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
             box-shadow:0 0 0 60px color-mix(in srgb,var(--accent) 5%,transparent),0 0 0 140px color-mix(in srgb,var(--accent) 3%,transparent)}
  .hero-mark svg{height:150px;width:auto;overflow:visible}
  .hero-mark .badge{width:250px;height:250px;display:grid;place-items:center;background:#fff;border-radius:50%;
                 box-shadow:0 10px 40px #0006;color:#0f2547;--logo-blue:#1f6fe0;transform:translate(-50px,10px)}
  @media (max-width:1100px){ .hero-mark{display:none} }
  /* En pantallas anchas el bloque de texto se corre a la izquierda para dejar espacio al logo */
  @media (min-width:1101px){ .hero .wrap > *{margin-left:0;margin-right:auto;max-width:680px} }
  .hero .eyebrow{color:var(--navy-accent)}
  .hero h1{font-size:clamp(2.3rem,5.4vw,4rem);max-width:20ch;margin-inline:auto}
  .hero p{color:var(--navy-muted);font-size:1.2rem;max-width:52ch;margin:0 auto 32px}
  .hero .ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .hero .btn.ghost{color:var(--navy-ink)}

  section{padding:88px 0}
  .section-head{max-width:62ch;margin-bottom:40px}
  .section-head p{color:var(--muted);margin:0;font-size:1.05rem}
  .alt{background:var(--surface);border-block:1px solid var(--line)}

  /* Services */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  /* Cuatro servicios en 2x2 para que las tarjetas sean anchas; 1 columna en celular */
  #servicios .grid{grid-template-columns:repeat(2,1fr);gap:22px}
  @media (max-width:640px){ #servicios .grid{grid-template-columns:1fr} }
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:flex;flex-direction:column}
  .alt .card{background:var(--bg)}
  .card .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
             background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);margin-bottom:18px}
  .card h3{font-size:1.3rem}
  .card p{color:var(--muted);margin:0 0 18px;flex:1}
  .card-sub{display:block;color:var(--ink);font-weight:600;margin-bottom:6px}
  .card .link{color:var(--accent);font-weight:600;text-decoration:none;font-size:.95rem}

  /* Opportunities */
  .opp .tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
            color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-bottom:14px;align-self:flex-start}
  .opp dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 20px;font-size:.92rem}
  .opp dt{color:var(--muted)} .opp dd{margin:0;font-weight:500}
  .disclaimer{font-size:.85rem;color:var(--muted);margin-top:22px;max-width:80ch}

  /* Why */
  .why{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:28px}
  .why div{border-top:2px solid var(--accent);padding-top:16px}
  .why h3{font-size:1.15rem}
  .why p{color:var(--muted);margin:0;font-size:.95rem}

  /* Por qué elegirnos: texto a la izquierda, logo en círculo a la derecha */
  #por-que{overflow:hidden}
  .why-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;align-items:center}
  .why-layout .section-head{margin-bottom:28px}
  .why-sub{font-size:1.3rem;margin:0 0 16px}
  .why-list{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:14px}
  .why-list li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;color:var(--muted)}
  .why-list li strong{color:var(--ink)}
  .why-list .chk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
                 background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .why-cierre{font-family:Fraunces,Georgia,serif;font-size:1.25rem;font-weight:600;color:var(--ink);margin:0}
  .why-mark{width:min(360px,100%);aspect-ratio:1;justify-self:center;border-radius:50%;display:grid;place-items:center;
            border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
            box-shadow:0 0 0 40px color-mix(in srgb,var(--accent) 5%,transparent),0 0 0 90px color-mix(in srgb,var(--accent) 3%,transparent)}
  .why-mark .badge{width:62%;height:62%;display:grid;place-items:center;background:#fff;border-radius:50%;
                   box-shadow:0 14px 40px #0f254726;color:#0f2547;--logo-blue:#1f6fe0;animation:float 6s ease-in-out infinite}
  .why-mark svg{width:46%;height:auto;display:block;overflow:visible}
  @media (max-width:860px){
    .why-layout{grid-template-columns:1fr;gap:72px}
    .why-mark{width:min(240px,70%);box-shadow:0 0 0 26px color-mix(in srgb,var(--accent) 5%,transparent),0 0 0 56px color-mix(in srgb,var(--accent) 3%,transparent);margin-bottom:40px}
  }
  /* Inicio: resumen de oportunidades enlazado a su página */
  .resumen{grid-template-columns:repeat(4,1fr)}
  .card.mini{text-decoration:none;color:inherit}
  .card.mini h3{font-size:1.15rem;flex:1}
  .card.mini .link{margin-top:10px}
  .ver-todas{margin:28px 0 0;text-align:center}
  .ver-todas .btn.ghost{color:var(--ink)}
  @media (max-width:1000px){ .resumen{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:560px){ .resumen{grid-template-columns:1fr} }
  /* About */
  .about{display:grid;grid-template-columns:320px 1fr;gap:56px;align-items:center}
  .photo{aspect-ratio:4/5;border-radius:var(--radius);border:1px solid var(--line);display:grid;place-items:center;
         color:var(--muted);font-size:.9rem;
         background:repeating-linear-gradient(135deg,var(--line) 0 12px,transparent 12px 24px),var(--bg)}
  .role{color:var(--accent);font-weight:600;margin:-.3em 0 1em}
  .about p{color:var(--muted)}
  /* Foto circular de Luciano */
  .photo{overflow:hidden;background:none;aspect-ratio:1;border-radius:50%;border:0;box-shadow:0 0 0 8px var(--surface),0 0 0 9px var(--line),0 18px 40px #0f25471f}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block;transform:scale(1.03)}
  @media (max-width:780px){ .about{grid-template-columns:1fr;gap:28px} .photo{max-width:260px} }

  /* CTA band */
  .band{background:var(--navy);color:var(--navy-ink);padding:64px 0}
  .band .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px}
  .band h2{margin:0;max-width:22ch}
  .band .btn.ghost{color:var(--navy-ink)}

  /* Contacto: elegir entre agendar una reunión o dejar los datos */
  .opciones{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
  .opcion{display:flex;gap:14px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);cursor:pointer;
          background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:20px;
          transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}
  .opcion:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-2px)}
  .opcion[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  .opcion b{display:block;font-size:1.1rem;margin-bottom:4px}
  .opcion small{display:block;color:var(--muted);font-size:.92rem;line-height:1.45}
  .opcion-ico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
              background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .opcion[aria-selected="true"] .opcion-ico{background:var(--accent);color:var(--accent-ink)}
  .panel-opcion{animation:fadeUp .4s ease both}
  .panel-opcion h3{font-size:1.15rem;margin-bottom:0}
  .agenda-marco{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .agenda-marco iframe{display:block;width:100%;height:720px;border:0}
  .agenda-alt{font-size:.88rem;color:var(--muted);margin:10px 0 0}
  .agenda-alt a{color:var(--accent);font-weight:600}
  .agenda-pendiente{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--radius);padding:32px;text-align:center}
  .agenda-pendiente p{margin:0 0 8px;color:var(--muted)}
  .agenda-pendiente p b{color:var(--ink)}
  .agenda-pendiente .btn{margin-top:12px}
  @media (max-width:720px){ .opciones{grid-template-columns:1fr} .agenda-marco iframe{height:880px} }
  /* Contact */
  .contact{display:grid;grid-template-columns:1fr 1.4fr;gap:48px}
  .channels{display:grid;gap:12px;margin:24px 0}
  .channel{display:flex;gap:12px;align-items:center;text-decoration:none;padding:14px 16px;border:1px solid var(--line);
           border-radius:12px;background:var(--surface)}
  .channel small{display:block;color:var(--muted);font-size:.8rem}
  form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;
       display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .f{display:grid;gap:6px;font-size:.88rem;font-weight:500}
  .f.full{grid-column:1/-1}
  .f input,.f select,.f textarea{font:inherit;font-weight:400;padding:11px 12px;border-radius:10px;
       border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
  .f textarea{min-height:110px;resize:vertical}
  .f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .ok{grid-column:1/-1;display:none;padding:14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
  @media (max-width:820px){ .contact{grid-template-columns:1fr} form{grid-template-columns:1fr} }

  footer{background:var(--navy);color:var(--navy-muted);padding:36px 0;font-size:.85rem}
  footer p{margin:.4em 0;max-width:90ch}

  .wa{position:fixed;right:18px;bottom:18px;z-index:20;width:56px;height:56px;border-radius:50%;background:#25d366;
      display:grid;place-items:center;box-shadow:0 6px 20px #0004}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <mask id="p-hole"><rect width="60" height="72" fill="#fff"/><circle cx="37" cy="40" r="9" fill="#000"/></mask>
    <clipPath id="p-low"><rect x="0" y="44" width="60" height="28"/></clipPath>
  </defs>
  <symbol id="logo-mark" viewBox="0 0 60 72">
    <circle cx="8" cy="8" r="7" style="fill:var(--logo-blue)"/>
    <g mask="url(#p-hole)">
      <circle cx="36" cy="40" r="22" fill="currentColor"/>
      <circle cx="36" cy="40" r="22" clip-path="url(#p-low)" style="fill:var(--logo-blue)"/>
      <rect x="6" y="18" width="16" height="54" rx="2" fill="currentColor"/>
    </g>
  </symbol>
</svg>

<script>
  // Contacto: pestañas «Agenda una reunión» / «Pide que te contactemos»
  const pestanas = [...document.querySelectorAll('.opciones [role="tab"]')];
  function mostrarOpcion(id, enfocar){
    pestanas.forEach(t => {
      const activa = t.id === "tab-" + id;
      t.setAttribute("aria-selected", activa);
      t.tabIndex = activa ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !activa;
      if (activa && enfocar) t.focus();
    });
  }
  pestanas.forEach((t, i) => {
    t.addEventListener("click", () => mostrarOpcion(t.id.replace("tab-", "")));
    t.addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const otra = pestanas[(i + (e.key === "ArrowRight" ? 1 : pestanas.length - 1)) % pestanas.length];
      mostrarOpcion(otra.id.replace("tab-", ""), true);
    });
  });
  document.querySelectorAll("[data-ir-a]").forEach(b => b.addEventListener("click", () => mostrarOpcion(b.dataset.irA, true)));
  // Si se llega con un motivo (botones «Consultar») o con ?opcion=datos, se abre directamente el formulario.
  const parametros = new URLSearchParams(location.search);
  if (pestanas.length && (parametros.has("motivo") || parametros.get("opcion") === "datos")) mostrarOpcion("datos");
  // En la página de contacto, el motivo que viene en la dirección (?motivo=...) queda seleccionado
  const selectorMotivo = document.getElementById("motivo");
  const motivoPedido = new URLSearchParams(location.search).get("motivo");
  if (selectorMotivo && motivoPedido) {
    if (![...selectorMotivo.options].some(o => o.value === motivoPedido)) selectorMotivo.add(new Option(motivoPedido, motivoPedido));
    selectorMotivo.value = motivoPedido;
  }

  // Menú móvil: abre/cierra con animación; se cierra al elegir una sección, tocar fuera o presionar Esc
  const menu = document.getElementById("menu"), menuBtn = document.getElementById("menu-btn"), backdrop = document.getElementById("backdrop");
  function setMenu(open){
    menu.classList.toggle("open", open);
    backdrop.classList.toggle("show", open);
    menuBtn.setAttribute("aria-expanded", open);
    menuBtn.setAttribute("aria-label", open ? "Cerrar menú" : "Abrir menú");
  }
  menuBtn.addEventListener("click", () => setMenu(!menu.classList.contains("open")));
  menu.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });
  backdrop.addEventListener("click", () => setMenu(false));
  document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
  matchMedia("(min-width:1181px)").addEventListener("change", e => { if (e.matches) setMenu(false); });

  // Sombra del encabezado al hacer scroll
  const header = document.querySelector("header");
  addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 8), { passive: true });

  // Aparición de los bloques al entrar en pantalla, con un pequeño escalonado entre hermanos
  const revealTargets = document.querySelectorAll(".section-head, .grid > *, .why-list > li, .why-mark, .why-sub, .why-cierre, .why > div, .about > *, .steps > *, .band .wrap > *, .contact > *, .disclaimer");
  revealTargets.forEach(el => {
    el.classList.add("reveal");
    const i = [...el.parentElement.children].filter(c => c.classList.contains("reveal")).indexOf(el);
    if (i > 0) el.style.transitionDelay = `${Math.min(i, 5) * 90}ms`;
  });
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target;
    el.classList.add("in");
    io.unobserve(el);
    // Al terminar, se quitan las clases para que vuelvan los efectos hover normales
    el.addEventListener("transitionend", function done(e){
      if (e.target !== el || e.propertyName !== "transform") return;
      el.classList.remove("reveal", "in"); el.style.transitionDelay = "";
      el.removeEventListener("transitionend", done);
    });
  }), { threshold: .15, rootMargin: "0px 0px -40px 0px" });
  revealTargets.forEach(el => io.observe(el));

  function enviar(e){
    e.preventDefault();
    const nombre = e.target.nombre.value.trim().split(" ")[0];
    const ok = document.getElementById("ok");
    ok.style.display = "block";
    ok.textContent = `Gracias, ${nombre}. (Simulación) Un asesor te contactará a la brevedad.`;
    e.target.reset();
    return false;
  }
</script>
